<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- T Letter with 3D effect -->
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main T shape -->
  <path d="M 10 8 L 45 8 L 45 15 L 32 15 L 32 52 L 23 52 L 23 15 L 10 15 Z" fill="url(#blueGrad)"/>
  
  <!-- Cyan curve accent -->
  <path d="M 8 10 Q 8 35, 15 45" stroke="url(#cyanGrad)" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Arrow accent -->
  <path d="M 35 5 L 45 0 L 40 10 Z" fill="url(#cyanGrad)"/>
  
  <!-- Text: TaxArc -->
  <text x="55" y="32" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e40af">
    Tax<tspan fill="#06b6d4">Arc</tspan>
  </text>
  
  <!-- Text: Global -->
  <text x="55" y="48" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#1e40af">
    Global
  </text>
</svg>
